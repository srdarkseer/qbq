[project]
name = "qbq"
version = "0.1.0"
description = "QbQ (pronounced \"Cubic\"): an agentic QA & security testing engine built on behavioral state graphs and deterministic verification."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["security-testing", "qa", "state-graph", "fastapi", "owasp", "rlvr", "verifier"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.7,<3",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.scripts]
qbq = "qbq.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qbq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
