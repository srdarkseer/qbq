[project]
name = "cubic"
version = "0.1.0"
description = "QbQ (Cubic): an agentic QA & security testing engine built on behavioral state graphs and deterministic verification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.scripts]
cubic = "cubic.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cubic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
